name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: |
          mkdir -p dist
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${p%/*}; arch=${p#*/}
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            echo "Building $os/$arch with CGO disabled..."
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -ldflags="-s -w" \
              -o dist/streambox-$os-$arch$ext
          done

      - name: Package
        run: |
          cd dist
          for f in streambox-*; do
            case "$f" in
              *.exe) zip "${f%.exe}.zip" "$f" ;;
              *)     tar -czf "$f.tar.gz" "$f" ;;
            esac
          done
          shasum -a 256 *.tar.gz *.zip > checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt